; ══════════════════════════════════════════════════════════════════════════════
; VITO BUSINESS OS - SUPERVISOR CONFIGURATION FOR QUEUE WORKERS
; ══════════════════════════════════════════════════════════════════════════════
;
; This configuration manages Laravel queue workers as daemon processes.
; Supervisor ensures workers are:
;   - Always running (auto-restart on crash)
;   - Started on boot (autostart)
;   - Gracefully recycled to prevent memory leaks
;
; Installation:
;   1. sudo apt install supervisor
;   2. sudo cp vito-worker.conf /etc/supervisor/conf.d/
;   3. sudo supervisorctl reread
;   4. sudo supervisorctl update
;   5. sudo supervisorctl start all
;
; Monitoring:
;   sudo supervisorctl status
;   sudo supervisorctl tail -f vito-worker:*
;
; ══════════════════════════════════════════════════════════════════════════════

; ═══════════════════════════════════════════════════════════════════════════════
; MAIN QUEUE WORKER (Default Queue)
; ═══════════════════════════════════════════════════════════════════════════════
;
; Processes general jobs: emails, notifications, order processing, etc.
; Multiple processes (numprocs) allow parallel job execution.

[program:vito-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vito-business-os/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=256
directory=/var/www/vito-business-os
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/vito-business-os/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=10
priority=100

; Command explanation:
;   --sleep=3        Wait 3 seconds between polling when queue is empty
;   --tries=3        Retry failed jobs 3 times before marking as failed
;   --max-time=3600  Restart worker after 1 hour to prevent memory leaks
;   --max-jobs=1000  Restart after processing 1000 jobs
;   --memory=256     Restart if process exceeds 256MB


; ═══════════════════════════════════════════════════════════════════════════════
; HIGH PRIORITY QUEUE (Payments, Critical Operations)
; ═══════════════════════════════════════════════════════════════════════════════
;
; Dedicated worker for time-sensitive operations that need immediate processing.
; Separated from main queue to ensure critical jobs aren't delayed.

[program:vito-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/vito-business-os/artisan queue:work redis --queue=high,default --sleep=1 --tries=5 --max-time=3600 --max-jobs=500 --memory=256
directory=/var/www/vito-business-os
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vito-business-os/storage/logs/worker-high.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=10
priority=50

; Note: --queue=high,default means process 'high' queue first, then 'default'


; ═══════════════════════════════════════════════════════════════════════════════
; SCHEDULER (Laravel Task Scheduling)
; ═══════════════════════════════════════════════════════════════════════════════
;
; Alternative to cron: run schedule:work which handles all scheduled tasks.
; More reliable than cron in containerized environments.
; NOTE: Only use this OR cron, not both.

[program:vito-scheduler]
process_name=%(program_name)s
command=php /var/www/vito-business-os/artisan schedule:work
directory=/var/www/vito-business-os
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vito-business-os/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stopwaitsecs=60
startsecs=10
priority=200


; ═══════════════════════════════════════════════════════════════════════════════
; REVERB WEBSOCKET SERVER (Real-time Features)
; ═══════════════════════════════════════════════════════════════════════════════
;
; Laravel Reverb for real-time broadcasting (order updates, notifications).
; Only enable if you're using Reverb for WebSockets.

[program:vito-reverb]
process_name=%(program_name)s
command=php /var/www/vito-business-os/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/vito-business-os
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vito-business-os/storage/logs/reverb.log
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=3
stopwaitsecs=60
startsecs=10
priority=300


; ═══════════════════════════════════════════════════════════════════════════════
; GROUP CONFIGURATION
; ═══════════════════════════════════════════════════════════════════════════════
;
; Group all Vito Business OS processes for easy management:
;   sudo supervisorctl restart vito:*
;   sudo supervisorctl status vito:*

[group:vito]
programs=vito-worker,vito-worker-high,vito-scheduler,vito-reverb
priority=100
