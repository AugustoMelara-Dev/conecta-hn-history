# ══════════════════════════════════════════════════════════════════════════════
# VITO BUSINESS OS - NGINX SERVER BLOCK CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
#
# Production-hardened Nginx configuration for Laravel application
#
# Installation:
#   1. sudo cp nginx_app.conf /etc/nginx/sites-available/vito-business-os
#   2. sudo ln -s /etc/nginx/sites-available/vito-business-os /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# SSL Certificate (Let's Encrypt):
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# ══════════════════════════════════════════════════════════════════════════════

# Rate limiting zone (DDoS protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP → HTTPS REDIRECT
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS SERVER BLOCK (MAIN)
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ─────────────────────────────────────────────────────────────────────────
    # Document Root & Index
    # ─────────────────────────────────────────────────────────────────────────
    root /var/www/vito-business-os/public;
    index index.php index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # SSL Configuration (Managed by Certbot)
    # ─────────────────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    
    # Modern SSL settings (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────────────────────────
    # Security Headers (OWASP Recommendations)
    # ─────────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # HSTS (uncomment after confirming SSL works - 1 year)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─────────────────────────────────────────────────────────────────────────
    # Performance: Gzip Compression
    # ─────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ─────────────────────────────────────────────────────────────────────────
    # Client Configuration
    # ─────────────────────────────────────────────────────────────────────────
    client_max_body_size 50M;  # Allow large image uploads
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    send_timeout 60s;

    # ─────────────────────────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/vito-business-os.access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/vito-business-os.error.log warn;

    # ─────────────────────────────────────────────────────────────────────────
    # SECURITY: Block Sensitive Files (CRITICAL!)
    # ─────────────────────────────────────────────────────────────────────────
    
    # Block .env files (contains secrets)
    location ~ /\.env {
        deny all;
        return 404;
    }
    
    # Block .git directory (source code exposure)
    location ~ /\.git {
        deny all;
        return 404;
    }
    
    # Block Composer files
    location ~ ^/(composer\.json|composer\.lock)$ {
        deny all;
        return 404;
    }
    
    # Block all hidden files and directories
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Block storage and vendor exposure
    location ~ ^/(storage|vendor)/ {
        deny all;
        return 404;
    }
    
    # Block Artisan CLI
    location = /artisan {
        deny all;
        return 404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Static Assets: Aggressive Caching (Vite handles cache busting)
    # ─────────────────────────────────────────────────────────────────────────
    
    # Vite-compiled assets (hashed filenames = cache forever)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    
    # Static images, fonts, etc.
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # API Rate Limiting (DDoS Protection)
    # ─────────────────────────────────────────────────────────────────────────
    
    # API endpoints - 60 requests per minute
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Login endpoints - 10 requests per minute (brute force protection)
    location ~ ^/(login|register|password) {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # WebSocket Support (Laravel Reverb)
    # ─────────────────────────────────────────────────────────────────────────
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Laravel Router (Main Handler)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # PHP-FPM Handler
    # ─────────────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        # Prevent directory traversal
        try_files $uri =404;
        
        # FastCGI settings
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI buffers (prevent 502 errors on large responses)
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
        
        # Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Health Check Endpoint (for load balancers)
    # ─────────────────────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
    
    # Robots.txt
    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }
    
    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}
