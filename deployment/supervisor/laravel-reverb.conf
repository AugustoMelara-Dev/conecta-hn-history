[program:laravel-reverb]
; ═══════════════════════════════════════════════════════════════════════════════
; Laravel Reverb WebSocket Server (Daemonized)
; ═══════════════════════════════════════════════════════════════════════════════
; NOTE: Replace [USER] and [APP_PATH] with your actual values before deployment
; Example: /var/www/conecta-hn
;
command=php [APP_PATH]/artisan reverb:start --host=0.0.0.0 --port=8080
directory=[APP_PATH]
user=[USER]

; Process Management
autostart=true
autorestart=true
startsecs=10
startretries=3

; Graceful Shutdown (Allow long-running connections to close properly)
stopwaitsecs=3600
stopsignal=SIGTERM

; Logging
stdout_logfile=/var/log/supervisor/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/reverb.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; Environment
environment=LARAVEL_SAIL="0"
