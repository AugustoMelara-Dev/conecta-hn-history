[program:laravel-worker]
; ═══════════════════════════════════════════════════════════════════════════════
; Laravel Queue Worker (Daemonized with Horizontal Scaling)
; ═══════════════════════════════════════════════════════════════════════════════
; NOTE: Replace [USER] and [APP_PATH] with your actual values before deployment
;
; Scaling: numprocs=2 spawns 2 parallel workers for redundancy
; Process names: laravel-worker_00, laravel-worker_01
;
process_name=%(program_name)s_%(process_num)02d
command=php [APP_PATH]/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=exports,notifications,default
directory=[APP_PATH]
user=[USER]
numprocs=2

; Process Management
autostart=true
autorestart=true
startsecs=10
startretries=3

; Graceful Shutdown (Allow current job to complete)
stopwaitsecs=3600
stopsignal=SIGTERM

; Logging (Each worker gets its own log via process_num)
stdout_logfile=/var/log/supervisor/worker_%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/worker_%(process_num)02d.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; Environment
environment=LARAVEL_SAIL="0"
