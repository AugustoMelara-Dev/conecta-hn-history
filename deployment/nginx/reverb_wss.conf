# ═══════════════════════════════════════════════════════════════════════════════
# NGINX REVERB CONFIGURATION (WSS Reverse Proxy)
# ═══════════════════════════════════════════════════════════════════════════════
# Include this block inside your main server {} block handling HTTPS (443)
# usually in /etc/nginx/sites-available/your-site.conf
# ═══════════════════════════════════════════════════════════════════════════════

location /app {
    # Proxy to Reverb (running locally on port 8080)
    proxy_pass http://127.0.0.1:8080;
    
    # ═══════════════════════════════════════════════════════════════════════════
    # WEBSOCKET HANDSHAKE HEADERS (CRITICAL)
    # ═══════════════════════════════════════════════════════════════════════════
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    
    # ═══════════════════════════════════════════════════════════════════════════
    # PROXY HEADERS (Correct User IP Handling)
    # ═══════════════════════════════════════════════════════════════════════════
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ═══════════════════════════════════════════════════════════════════════════
    # TIMEOUTS (Prevent premature disconnection)
    # ═══════════════════════════════════════════════════════════════════════════
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    
    # Disable buffering for real-time responsiveness
    proxy_buffering off;
}

location /apps {
     # Handle Pusher-protocol app authentication/stats (if needed)
     proxy_pass http://127.0.0.1:8080;
     proxy_http_version 1.1;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
}
