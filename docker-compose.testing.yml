# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  EPHEMERAL MYSQL 8.0 TESTING INFRASTRUCTURE                              ║
# ║  Purpose: Run concurrency tests requiring FOR UPDATE SKIP LOCKED         ║
# ║  Optimization: tmpfs (RAM disk) for maximum I/O performance              ║
# ║  Isolation: Port 33060 to avoid conflicts with local MySQL               ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:
  mysql_testing:
    image: mysql:8.0
    container_name: conecta_mysql_testing
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: testing_concurrency
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: testing
      MYSQL_PASSWORD: secret
    # TMPFS: Store database in RAM for maximum speed
    # Data is volatile (destroyed on container stop) - perfect for tests
    tmpfs:
      - /var/lib/mysql:size=512M
    # MySQL 8.0 optimizations for testing
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-flush-log-at-trx-commit=0
      --innodb-flush-method=nosync
      --innodb-buffer-pool-size=128M
      --max-connections=200
      --skip-log-bin
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-psecret",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
