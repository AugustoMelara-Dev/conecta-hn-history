version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      laravel-and-runtime:
        patterns:
          - "laravel/*"
          - "phpunit/*"
          - "pestphp/*"
          - "larastan/*"
          - "filament/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      frontend-runtime:
        patterns:
          - "react"
          - "react-dom"
          - "@inertiajs/*"
          - "@playwright/*"
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "postcss"
          - "axios"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
