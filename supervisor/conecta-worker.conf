; ═══════════════════════════════════════════════════════════════════════════
; CONECTA HN - SUPERVISOR QUEUE WORKER CONFIGURATION
; ═══════════════════════════════════════════════════════════════════════════
;
; Installation:
;   1. Copy this file to /etc/supervisor/conf.d/conecta-worker.conf
;   2. Run: sudo supervisorctl reread
;   3. Run: sudo supervisorctl update
;   4. Run: sudo supervisorctl start "conecta-worker:*"
;
; Monitoring:
;   - sudo supervisorctl status
;   - sudo supervisorctl tail -f conecta-worker:conecta-worker_00
;
; ═══════════════════════════════════════════════════════════════════════════

[program:conecta-worker]
; ───────────────────────────────────────────────────────────────────────────
; COMMAND: Laravel Queue Worker
; ───────────────────────────────────────────────────────────────────────────
; --sleep=3    : Wait 3 seconds when no jobs available (saves CPU)
; --tries=3    : Retry failed jobs up to 3 times before marking as failed
; --max-time=3600 : Restart worker every hour to prevent memory leaks
; --memory=128 : Kill worker if memory exceeds 128MB
; ───────────────────────────────────────────────────────────────────────────
command=php /var/www/conectahn/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=128

; ───────────────────────────────────────────────────────────────────────────
; PROCESS CONFIGURATION
; ───────────────────────────────────────────────────────────────────────────
process_name=%(program_name)s_%(process_num)02d
numprocs=2                          ; Run 2 workers for parallel processing
directory=/var/www/conectahn        ; Working directory
user=www-data                       ; Run as web server user
autostart=true                      ; Start on system boot
autorestart=true                    ; Restart if crashes
startsecs=0                         ; Consider started immediately
startretries=3                      ; Retry starting 3 times if fails

; ───────────────────────────────────────────────────────────────────────────
; LOGGING
; ───────────────────────────────────────────────────────────────────────────
stdout_logfile=/var/log/supervisor/conecta-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/conecta-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ───────────────────────────────────────────────────────────────────────────
; GRACEFUL STOP
; ───────────────────────────────────────────────────────────────────────────
stopwaitsecs=300                    ; Wait 5 minutes for graceful shutdown
stopasgroup=true                    ; Stop all child processes
killasgroup=true                    ; Kill all child processes
